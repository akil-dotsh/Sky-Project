{% extends "core/base_staff.html" %}
{% load static %}

{% block content %}

<!DOCTYPE html>
<html>
<head>
    <title>Drafts</title>
    <link rel="stylesheet" href="{% static 'css/messaging/message.css' %}">
</head>

<body>

<div class="island"> <!-- match your CSS -->
    <h3>📬 Messaging</h3>

    <a href="{% url 'messaging:messaging' %}">✉️ New Message</a>
    <a href="{% url 'messaging:inbox' %}">📥 Inbox</a>
    <a href="{% url 'messaging:draft' %}" class="active">📝 Drafts</a>
    <a href="{% url 'messaging:sent' %}">📤 Sent</a>
</div> 

<div class="content">

    <div class="card">
        <h2>Drafts</h2>

        <div class="draft-container">
            {% for message in messages %}
                <a href="{% url 'messaging:message_detail' message.message_id %}" class="draft-card">
                    
            
                    <div class="sender">
                     To: {{ message.recipient }}
                    </div>

                    <div class="subject">
                      {{ message.subject }}
                    </div>

                    <div class="time">
                        {{ message.sent_at }}
                    </div>

                </a>

            {% empty %}
                <div class="empty">No messages</div>
            {% endfor %}

        </div>

    </div>

</div>

</body>
</html>

{% endblock %}
