{% extends "core/base_staff.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/messaging/message.css' %}">

<!-- ISLAND MENU -->

<div class="island">
    <h3>📬 Messaging</h3>

    <a href="{% url 'messaging:messaging' %}">✉️ New Message</a>
    <a href="{% url 'messaging:inbox' %}">📥 Inbox</a>
    <a href="{% url 'messaging:draft' %}">📝 Drafts</a>
    <a href="{% url 'messaging:sent' %}">📤 Sent</a>
</div>


<!-- MAIN CONTENT -->
<div class="message-content">

   

    <div class="msg-card">

        <h2>Compose Message</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <label>To</label>
            <input type="text" name="recipient">

            <label>Teams</label>
            <input type="text" name="teams">

            <label>Subject</label>
            <input type="text" name="subject">

            <label>Message</label>
            <textarea name="body" rows="6"></textarea>

            <label>Attachment</label>
            <input type="file" name="attachment">

            <div class="button-group">
                <button type="submit" name="action" value="send" class="send">Send</button>
                <button type="submit" name="action" value="draft" class="draft">Save Draft</button>
                <button type="button" class="delete" onclick="this.form.reset()">Delete</button>
            </div>


        </form>

    </div>

</div>

<script>
let draftId = null;

function autosaveDraft() {

    const subject = document.querySelector("[name=subject]").value;
    const body = document.querySelector("[name=body]").value;
    const recipient = document.querySelector("[name=recipient]").value;

    fetch("/messaging/autosave/", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": getCSRFToken()
        },
        body: new URLSearchParams({
            draft_id: draftId || "",
            subject: subject,
            body: body,
            recipient: recipient
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.draft_id) {
            draftId = data.draft_id;
        }
    });
}

setInterval(autosaveDraft, 5000);

function getCSRFToken() {
    return document.cookie.split('; ')
        .find(row => row.startsWith('csrftoken='))
        ?.split('=')[1];
}
</script>

{% endblock %}
