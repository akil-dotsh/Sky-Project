<!DOCTYPE html>
<html>
<head>
    <title>Message Detail</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* Layout */
        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar (Sky-style clean panel) */
        .sidebar {
            width: 240px;
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        .sidebar h3 {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .sidebar a {
            display: block;
            padding: 10px 12px;
            margin-bottom: 8px;
            text-decoration: none;
            color: #cbd5e1;
            border-radius: 8px;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #1e293b;
            color: white;
        }

        /* Content */
        .content {
            flex: 1;
            padding: 40px;
        }

        .page-title {
            font-size: 22px;
            margin-bottom: 20px;
        }

        /* Message Card */
        .message-box {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            max-width: 800px;
        }

        .message-box h3 {
            margin-top: 0;
            font-size: 20px;
        }

        /* Meta info */
        .meta {
            display: grid;
            gap: 6px;
            margin-top: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
            color: #6b7280;
        }

        .meta strong {
            color: #111827;
        }

        /* Message body */
        .body {
            margin-top: 20px;
            line-height: 1.7;
            font-size: 15px;
            color: #374151;
            white-space: pre-line;
        }

        /* Back button */
        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 14px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.2s;
        }

        .back:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <div class="sidebar">
        <h3>📬 Messaging</h3>

        <a href="{% url 'messaging:messaging' %}">✉️ New Message</a>
        <a href="{% url 'messaging:inbox' %}">📥 Inbox</a>
        <a href="{% url 'messaging:draft' %}">📝 Drafts</a>
        <a href="{% url 'messaging:sent' %}">📤 Sent</a>
    </div>

    <!-- Main Content -->
    <div class="content">

        <div class="page-title">Message Detail</div>

        <div class="message-box">
            <h3>{{ message.subject }}</h3>

            <div class="meta">
                <div><strong>From:</strong> {{ message.sender }}</div>
                <div><strong>To:</strong> {{ message.recipient }}</div>
                <div><strong>Date:</strong> {{ message.sent_at }}</div>
            </div>

            <div class="body">
                {{ message.body }}
            </div>
        </div>

        <a href="{% url 'messaging:inbox' %}" class="back">⬅ Back to Inbox</a>

    </div>

</div>

</body>
</html>
