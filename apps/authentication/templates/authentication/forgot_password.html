{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/authentication/auth.css' %}">
</head>

<body>
  <section class="auth-hero">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">

          <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo text-center">
              <img src="{% static 'img/sky-uk-logo.jpg' %}" alt="Sky Logo" class="login-logo">
              <h2 class="portal-title mt-3">OpenSky</h2>
              <p class="portal-subtitle">Engineering Team Directory</p>
            </div>

            <!-- Title -->
            <h3 class="auth-title text-center">Forgot your password?</h3>
            <p class="auth-subtitle text-center">
              Enter your email address and we’ll send you a reset link if exist.
            </p>
              
              {% if error %}
              <div class="alert alert-danger" role="alert">
                {{ error }}
              </div>
            {% endif %}
            <!-- Form -->
            <div class="auth-form">
              <form method="POST" action="{% url 'forgot_password' %}">
                {% csrf_token %}

                <label for="email" class="form-label">Email</label>
                {{ form.email }}

                <div class="auth-action">
                  <button class="btn btn-primary btn-lg w-100 fw-semibold" type="submit">
                    Send Reset Link
                  </button>
                </div>
              </form>
            </div>

            <!-- Links -->
            <div class="auth-links text-center mt-3">
              <a href="{% url 'dev_login' %}" class="link-soft">Back to Login</a>
            </div>

          </div>

        </div>
      </div>
    </div>
  </section>
</body>
</html>
