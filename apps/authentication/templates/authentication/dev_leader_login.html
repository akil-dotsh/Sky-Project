{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/authentication/auth.css' %}">
</head>

<body>
  <section class="auth-hero">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">

          <div class="auth-card">
            <div class="auth-logo text-center mb-4">
              <img src="{% static 'img/sky-uk-logo.jpg' %}" alt="Sky Logo" class="login-logo">
              <h2 class="portal-title mt-3">OpenSky</h2>
              <p class="portal-subtitle">Engineering Team Directory</p>
            </div>

            {% if error %}
              <div class="alert alert-danger" role="alert">
                {{ error }}
              </div>
            {% endif %}

            <form method="POST" action="{% url 'dev_login' %}">
              {% csrf_token %}

              <div class="auth-form">
                <label for="email" class="form-label">Email</label>
                {{ form.email }}

                <label for="password" class="form-label">Password</label>
                {{ form.password }}

                <div class="auth-row">
                  <label class="remember">
                    <input type="checkbox" name="remember_me">
                    <span>Remember me</span>
                  </label>

                  <a href="#" class="link-soft">Forgot Password?</a>
                </div>
              </div>

              <div class="auth-action">
                <button class="btn btn-primary btn-lg w-100 fw-semibold" type="submit">
                  Sign In
                </button>
              </div>
            </form>

            <div class="auth-links">
              <a href={% url 'register' %} class="link-soft">Create account</a>
              <span class="dot-sep">•</span>
              <a href="{% url 'admin_login' %}" class="link-soft">Administrator Login</a>
            </div>

          </div>

        </div>
      </div>
    </div>
  </section>
</body>
</html>
