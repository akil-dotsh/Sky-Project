{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Reset Complete</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/authentication/auth.css' %}">
</head>

<body>
  <section class="auth-hero">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">

          <div class="auth-card text-center">

            <!-- Logo -->
            <div class="auth-logo">
              <img src="{% static 'images/sky-uk-logo.jpg' %}" alt="Sky Logo" class="login-logo">
              <h2 class="portal-title mt-3">OpenSky</h2>
              <p class="portal-subtitle">Engineering Team Directory</p>
            </div>

            <h3 class="auth-title mt-4">Password updated</h3>
            <p class="auth-subtitle">
              Your password has been reset successfully.
            </p>

            <div class="auth-links mt-4">
              <a href="{% url 'dev_login' %}" class="link-soft">Go to Login</a>
            </div>

          </div>

        </div>
      </div>
    </div>
  </section>
</body>
</html>
