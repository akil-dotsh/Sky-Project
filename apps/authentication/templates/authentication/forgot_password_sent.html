{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check Your Email</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/authentication/auth.css' %}">
</head>

<body>
  <section class="auth-hero">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">

          <div class="auth-card text-center">

            <!-- Logo -->
            <div class="auth-logo">
              <img src="{% static 'img/sky-uk-logo.jpg' %}" alt="Sky Logo" class="login-logo">
              <h2 class="portal-title mt-3">OpenSky</h2>
              <p class="portal-subtitle">Engineering Team Directory</p>
            </div>

            <!-- Success Message -->
            <h3 class="auth-title">Check your inbox</h3>
            <p class="auth-subtitle">
              If an account exists for that email, you’ll receive a password reset link shortly.
              Please check your spam or junk folder if you don’t see it.
            </p>

            <div class="auth-action mt-3">
              <a href="{% url 'dev_login' %}" class="btn btn-primary btn-lg w-100 fw-semibold">
                Back to Login
              </a>
            </div>

            <div class="auth-links">
              <a href="{% url 'forgot_password' %}" class="link-soft">Try another email</a>
            </div>

          </div>

        </div>
      </div>
    </div>
  </section>
</body>
</html>
